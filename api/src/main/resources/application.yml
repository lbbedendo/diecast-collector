spring:
  application:
    name: diecast-collector-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:diecast_collector}
    username: ${DB_USERNAME:diecast_collector}
    password: ${DB_PASSWORD:diecast_collector}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-token-ttl-minutes: ${APP_JWT_EXPIRATION_MINUTES:43200}
  storage:
    photos-dir: ${APP_PHOTOS_DIR:./data/photos}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}

logging:
  level:
    com.diecastcollector.api: INFO
