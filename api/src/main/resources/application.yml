spring:
  application:
    name: diecast-collector-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:diecast_collector}
    username: ${DB_USERNAME:diecast_collector}
    password: ${DB_PASSWORD:diecast_collector}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-token-ttl-minutes: ${APP_JWT_EXPIRATION_MINUTES:43200}
  storage:
    photos-dir: ${APP_PHOTOS_DIR:./data/photos}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
    dev-login:
      # Mints a real app JWT for a throwaway local user without a Google/Apple ID token, so the
      # mobile app can be exercised against a local API before sign-in is wired up. Never enable
      # outside local development — see DevAuthController.
      enabled: ${APP_AUTH_DEV_LOGIN_ENABLED:false}

logging:
  level:
    com.diecastcollector.api: INFO
